name: 導入動画用の実画面収録
on:
  pull_request:
    paths:
      - 'tools/video/**'
      - '.github/workflows/intro-capture.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - name: Playwrightを準備
        run: |
          npm ci
          npx playwright install --with-deps chromium
          node --check tools/video/capture-intro.mjs
          node tools/video/design.mjs --check
      - name: 実アプリとPostgreSQLを起動
        run: docker compose up -d --build --wait
      - name: 実画面の業務フローを収録
        run: node tools/video/capture-intro.mjs
      - name: 診断ログを保存
        if: always()
        run: |
          mkdir -p artifacts/intro-capture
          docker compose logs --no-color > artifacts/intro-capture/compose.log
      - name: 録画と操作証跡を保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotorelay-intro-capture
          path: artifacts/intro-capture
          retention-days: 14
      - name: 収録環境を停止
        if: always()
        run: docker compose down -v
