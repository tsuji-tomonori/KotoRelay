name: 検証と品質ポータル
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
      - name: 依存とブラウザを準備
        run: |
          uv sync --frozen
          npm ci
          npx playwright install --with-deps chromium
          python3 tools/quintflow.py setup
      - name: 実装と生成設計を検証
        id: checks
        continue-on-error: true
        run: uv run python tools/project/verify.py
      - name: ポータルをブラウザで検証
        if: always()
        id: portal
        continue-on-error: true
        run: |
          npx playwright test --config e2e/portal.config.ts --list --reporter=json > artifacts/portal-inventory.json
          npx playwright test --config e2e/portal.config.ts
      - name: ポータルの段階別証跡を追加
        if: always()
        run: uv run python tools/project/record_portal.py
      - name: 実行原本を保存
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: quality-${{ github.sha }}
          path: |
            artifacts/*.json
            artifacts/*.xml
            artifacts/frontend-coverage
            artifacts/e2e
            artifacts/portal-tests
          retention-days: 14
      - name: Pages成果物を保存
        if: always() && github.ref == 'refs/heads/main' && hashFiles('artifacts/site/index.html') != ''
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: artifacts/site
      - name: 失敗をCI結果へ反映
        if: always()
        run: test '${{ steps.checks.outcome }}' = success && test '${{ steps.portal.outcome }}' = success
  publish:
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 設計と実行結果を公開
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
